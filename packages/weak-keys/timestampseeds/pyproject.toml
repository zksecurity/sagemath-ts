[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timestampseeds"
version = "0.1.0"
description = "Offline public-key candidates from explicitly modeled timestamp-seeded RNGs"
requires-python = ">=3.11"
dependencies = ["cryptography==50.0.2"]

[project.scripts]
timestampseeds = "timestampseeds.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
