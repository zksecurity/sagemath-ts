name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build playground
        run: bun playground/build.ts

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp playground/index.html _site/
          cp playground/playground.html _site/
          cp playground/course.html _site/
          cp playground/docs.html _site/
          cp playground/styles.css _site/
          cp playground/course.css _site/
          cp playground/docs.css _site/
          cp playground/home.css _site/
          cp playground/runner.js _site/
          cp playground/editor.js _site/
          cp playground/docs-data.json _site/
          cp -r playground/dist _site/
          cp -r playground/lessons _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
