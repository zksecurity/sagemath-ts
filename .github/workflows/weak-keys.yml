name: Weak-key research package
on:
  push:
    paths:
      - 'packages/**'
      - 'tests/weak-keys-typecheck.ts'
      - 'tests/llm-doc.test.ts'
      - 'LLM.md'
      - 'bun.lock'
      - 'package.json'
      - '.github/workflows/weak-keys.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'tests/weak-keys-typecheck.ts'
      - 'tests/llm-doc.test.ts'
      - 'LLM.md'
      - 'bun.lock'
      - 'package.json'
      - '.github/workflows/weak-keys.yml'
permissions:
  contents: read

jobs:
  typescript:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun --silent run quiet -- bun run test:weak-keys
      - name: Live native RNG/profile comparisons (includes fixture regeneration on Linux)
        run: bun --silent run quiet -- bun run test:weak-keys:native
      - run: bun --silent run quiet -- bun test tests/llm-doc.test.ts
      - run: bun --silent run quiet -- bun run --cwd packages/weak-keys build
      - name: Scoped typecheck (reports existing dependency errors, fails on new errors)
        run: bun --silent run quiet -- bun tests/weak-keys-typecheck.ts
      - run: bun --silent run quiet -- bun x biome check packages/weak-keys/src tests/weak-keys-typecheck.ts
      - run: bun run weak-keys:timestampseeds estimate --start 1 --end 3

  microsoft-reference:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Compare native Microsoft CRT output
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          bun --silent run quiet -- bun packages/weak-keys/timestampseeds/tests/reference/compare.ts --windows
